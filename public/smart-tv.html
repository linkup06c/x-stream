<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>X-Stream Engine Ultra Supremo</title>

<!-- SUPORTE A STREAMING HLS (M3U8 / LIVES / IPTV) -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
}

/* Dois vídeos de standby para alternância suave sem engasgos */
#mediaVideo, #mediaVideo2 {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000; 
    object-fit: contain;
    display: none; 
    z-index: 10;
    transform: translate3d(0, 0, 0);
    will-change: transform;
    backface-visibility: hidden;
}

#mediaAudio { display: none; }

#mediaImage {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000; object-fit: contain;
    display: none; z-index: 15;
}

#brandLogo {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 9999;
    height: 24px;
    width: auto;
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
}

#cursorLayer{
position:fixed; top:0; left:0; width:100%; height:100%;
z-index:99999; color:transparent; background:transparent;
user-select:text; -webkit-user-select:text; cursor:text;
}

#keyDebug {
    position: fixed; top: 25px; right: 25px; z-index: 99999;
    background: rgba(0, 0, 0, 0.7); color: #00ff66;
    padding: 6px 14px; border-radius: 8px; font-size: 12px;
    font-family: monospace; display: none; border: 1px solid rgba(0, 255, 102, 0.3);
}

#errorBox {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; text-align: center; z-index: 20000;
}

#errorTitle { font-size: 40px; color: #ff3333; margin-bottom: 20px; }
#errorMessage { font-size: 22px; max-width: 80%; color: #ccc; }
</style>
</head>

<body>

<div id="cursorLayer">Texto de teste invisível</div>
<img id="brandLogo" src="logo.png">
<div id="keyDebug">TECLA: -</div>

<!-- Sistema de Vídeo Duplo para transição perfeita em TVs -->
<video id="mediaVideo" autoplay playsinline webkit-playsinline preload="auto" crossorigin="anonymous"></video>
<video id="mediaVideo2" autoplay playsinline webkit-playsinline preload="auto" crossorigin="anonymous"></video>

<audio id="mediaAudio" autoplay preload="auto" loop></audio>
<img id="mediaImage">

<div id="errorBox">
    <div id="errorTitle">Erro</div>
    <div id="errorMessage">Não foi possível reproduzir este formato.</div>
</div>

<script>
// ==========================================
// CONFIGURAÇÃO DOS LINKS DO STANDBY
// ==========================================
var STANDBY_VIDEO_URL = "https://noa.it.tabdigital.cloud/public.php/dav/files/Q5qNxQgAEpcDJrA/standby_video.mp4";
var STANDBY_AUDIO_URL = "https://noa.it.tabdigital.cloud/public.php/dav/files/Q5qNxQgAEpcDJrA/standby_audio.mp3";
// ==========================================

var SERVER_URL = (window.location.origin && window.location.origin.startsWith("http"))
    ? window.location.origin 
    : "https://x-stream-56ya.onrender.com";

var wsProtocol = SERVER_URL.startsWith("https") ? "wss://" : "ws://";
var WS_URL = wsProtocol + SERVER_URL.replace(/^https?:\/\//, '');

var mediaVideo = document.getElementById("mediaVideo");
var mediaVideo2 = document.getElementById("mediaVideo2");
var mediaAudio = document.getElementById("mediaAudio");
var mediaImage = document.getElementById("mediaImage");

var activeVideoSlot = 1; // Alterna entre 1 e 2 no standby
var tipoAtual = "";
var urlAtual = "";
var ultimaURL = "";
var hlsPlayer = null;
var tempoInicialAjustado = false;
var ultimoComandoIdProcessado = 0;
var emModoStandbyAnterior = false;

function mostrarErro(msg){
    var box = document.getElementById("errorBox");
    if(box){
        box.style.display = "flex";
        var texto = document.getElementById("errorMessage");
        if(texto) texto.innerHTML = msg;
    }
}

function limparMidia(){
    tempoInicialAjustado = false;

    if (hlsPlayer) {
        try { hlsPlayer.destroy(); hlsPlayer = null; } catch(e){}
    }

    try { mediaVideo.pause(); mediaVideo.removeAttribute("src"); mediaVideo.load(); } catch(e){}
    try { mediaVideo2.pause(); mediaVideo2.removeAttribute("src"); mediaVideo2.load(); } catch(e){}
    try { mediaAudio.pause(); mediaAudio.removeAttribute("src"); mediaAudio.load(); } catch(e){}
    try { mediaImage.removeAttribute("src"); } catch(e){}
}

function receberMidia(url, tempoInicial, isStandby){
    if(!url) {
        urlAtual = "";
        ultimaURL = "";
        limparMidia();
        esconderTodos();
        return;
    }
    
    if(url === urlAtual) return;
    urlAtual = url;
    ultimaURL = url;
    limparMidia();

    if (isStandby) {
        tipoAtual = "standby";
        iniciarStandbyDuplo();
        return;
    }

    mediaVideo.muted = false;
    var urlLimpa = url.split('?')[0].toLowerCase();

    if (urlLimpa.endsWith('.m3u8')) {
        tentarHLS(url, tempoInicial);
    } else {
        tentarVideo(url, tempoInicial);
    }
}

// Lógica de revezamento suave sem travamentos para TVs
function iniciarStandbyDuplo() {
    mediaVideo.style.display = "block";
    mediaVideo2.style.display = "none";
    mediaImage.style.display = "none";
    mediaAudio.style.display = "none";

    mediaVideo.muted = true;
    mediaVideo.src = STANDBY_VIDEO_URL;
    mediaVideo.load();
    mediaVideo.play().catch(function(){});

    mediaVideo2.muted = true;
    mediaVideo2.src = STANDBY_VIDEO_URL;
    mediaVideo2.load();

    mediaAudio.src = STANDBY_AUDIO_URL;
    mediaAudio.load();
    mediaAudio.play().catch(function(){});
}

// Quando o slot 1 está acabando, troca instantaneamente para o slot 2 já pre-carregado
mediaVideo.ontimeupdate = function() {
    if (emModoStandbyAnterior && mediaVideo.duration && !isNaN(mediaVideo.duration)) {
        if (mediaVideo.duration - mediaVideo.currentTime < 0.4 && activeVideoSlot === 1) {
            activeVideoSlot = 2;
            mediaVideo2.currentTime = 0;
            mediaVideo2.play().catch(function(){});
            mediaVideo2.style.display = "block";
            mediaVideo.style.display = "none";
            mediaVideo.pause();
        }
    }
};

// Quando o slot 2 está acabando, troca instantaneamente de volta para o slot 1
mediaVideo2.ontimeupdate = function() {
    if (emModoStandbyAnterior && mediaVideo2.duration && !isNaN(mediaVideo2.duration)) {
        if (mediaVideo2.duration - mediaVideo2.currentTime < 0.4 && activeVideoSlot === 2) {
            activeVideoSlot = 1;
            mediaVideo.currentTime = 0;
            mediaVideo.play().catch(function(){});
            mediaVideo.style.display = "block";
            mediaVideo2.style.display = "none";
            mediaVideo2.pause();
        }
    }
};

function tentarHLS(url, tempoInicial) {
    if (Hls.isSupported()) {
        hlsPlayer = new Hls({
            enableWorker: false, 
            maxBufferLength: 10,
            maxMaxBufferLength: 20,
            lowLatencyMode: false
        });
        hlsPlayer.loadSource(url);
        hlsPlayer.attachMedia(mediaVideo);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
            tipoAtual = "video";
            mostrarVideo();
            iniciarVideo(tempoInicial);
        });
        hlsPlayer.on(Hls.Events.ERROR, function(event, data) {
            if (data.fatal) { tentarVideo(url, tempoInicial); }
        });
    } else if (mediaVideo.canPlayType('application/vnd.apple.mpegurl')) {
        mediaVideo.src = url;
        tentarVideo(url, tempoInicial);
    } else {
        tentarVideo(url, tempoInicial);
    }
}

function tentarVideo(url, tempoInicial){
    var confirmado = false;
    mediaVideo.src = url;
    mediaVideo.load();

    function ativarVideo(){
        if(confirmado) return;
        confirmado = true;
        tipoAtual = "video";
        mostrarVideo();
        iniciarVideo(tempoInicial);
    }

    mediaVideo.onloadeddata = ativarVideo;
    mediaVideo.oncanplay = ativarVideo;
    mediaVideo.onerror = function(){ if(!confirmado) tentarAudioFila(url); };
}

function tentarAudioFila(url){
    var confirmado = false;
    mediaAudio.src = url;
    mediaAudio.load();

    mediaAudio.oncanplay = function(){
        if(confirmado) return;
        confirmado = true; 
        tipoAtual = "audio";
        mediaAudio.play();
    };

    mediaAudio.onerror = function(){ if(!confirmado) tentarImagem(url); };
}

function tentarImagem(url){
    var img = new Image();
    img.onload = function(){
        tipoAtual = "image"; 
        mediaImage.src = url;
        mostrarImage(); 
    };
    img.src = url;
}

function esconderTodos(){
    mediaVideo.style.display = "none";
    mediaVideo2.style.display = "none";
    mediaAudio.style.display = "none";
    mediaImage.style.display = "none";
}

function mostrarVideo(){ esconderTodos(); mediaVideo.style.display = "block"; }
function mostrarImage(){ esconderTodos(); mediaImage.style.display = "block"; }

function iniciarVideo(tempoInicial){
    if(tempoInicial && !tempoInicialAjustado){
        try { mediaVideo.currentTime = Number(tempoInicial); } catch(e){}
        tempoInicialAjustado = true;
    }

    var tentativa = mediaVideo.play();
    if(tentativa !== undefined){
        tentativa.then(function(){}).catch(function(){ 
            setTimeout(function(){ iniciarVideo(tempoInicial); }, 500); 
        });
    }
}

function aplicarEstado(dados) {
    var isStandby = dados.modoStandby === true;
    var url = "";

    if (isStandby) {
        url = STANDBY_VIDEO_URL;
    } else {
        if(dados.fila && dados.fila.length > 0 && dados.fila[dados.atual]){
            url = dados.fila[dados.atual].url || dados.fila[dados.atual];
        }
        if(!url && dados.video){ url = dados.video; }
    }

    if (url) {
        if (url !== urlAtual || isStandby !== emModoStandbyAnterior) {
            emModoStandbyAnterior = isStandby;
            receberMidia(url, dados.currentTime || 0, isStandby);
        }
    } else {
        if (urlAtual !== "") {
            urlAtual = "";
            ultimaURL = "";
            emModoStandbyAnterior = false;
            limparMidia();
            esconderTodos();
        }
    }

    if (mediaVideo) {
        var isPlaying = (dados.playing !== undefined) ? dados.playing : dados.reproduzindo;

        if (isPlaying === false && !mediaVideo.paused) {
            mediaVideo.pause();
            mediaVideo2.pause();
            if(!mediaAudio.paused) mediaAudio.pause();
        } else if (isPlaying === true && mediaVideo.paused && !emModoStandbyAnterior) {
            mediaVideo.play().catch(function(){});
        }

        if (dados.volume !== undefined && !isStandby) { mediaVideo.volume = dados.volume / 100; }
        if (dados.mudo !== undefined && !isStandby) { mediaVideo.muted = dados.mudo; }

        if (dados.comandoId && dados.comandoId !== ultimoComandoIdProcessado && !isStandby) {
            ultimoComandoIdProcessado = dados.comandoId;
            
            if (dados.ultimoComando === 'forward' || dados.ultimoComando === 'avancar_15' || dados.ultimoComando === '+15') {
                mediaVideo.currentTime = Math.min(mediaVideo.duration || 0, mediaVideo.currentTime + 15);
            } else if (dados.ultimoComando === 'rewind' || dados.ultimoComando === 'voltar_15' || dados.ultimoComando === '-15') {
                mediaVideo.currentTime = Math.max(0, mediaVideo.currentTime - 15);
            } else if (dados.currentTime !== undefined && Math.abs(mediaVideo.currentTime - dados.currentTime) > 2) {
                mediaVideo.currentTime = dados.currentTime;
            }
        }
    }
}

function conectarWebSocket() {
    var ws = new WebSocket(WS_URL);
    ws.onmessage = function(event) {
        try {
            var dados = JSON.parse(event.data);
            aplicarEstado(dados);
        } catch(e){}
    };
    ws.onclose = function() { setTimeout(conectarWebSocket, 3000); };
}
conectarWebSocket();

function verificarServidor(){
    var xhr = new XMLHttpRequest();
    xhr.open("GET", SERVER_URL + "/status?t=" + Date.now(), true);
    xhr.onreadystatechange = function(){
        if(xhr.readyState === 4){
            if(xhr.status === 200){
                try{
                    var dados = JSON.parse(xhr.responseText);
                    aplicarEstado(dados);
                }catch(e){}
            }
            setTimeout(verificarServidor, 3000);
        }
    };
    xhr.onerror = function() { setTimeout(verificarServidor, 3000); };
    xhr.send();
}
verificarServidor();

mediaVideo.onended = function(){ 
    if(!emModoStandbyAnterior) { enviarComando("next"); }
};

function enviarComando(slink){
    var xhr = new XMLHttpRequest();
    xhr.open("POST", SERVER_URL + "/controle", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.send(JSON.stringify({ slink: slink }));
}
</script>

</body>
</html>
